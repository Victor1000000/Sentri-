<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--green:#1ED760;--black:#121212;--card:#181818;--card2:#282828;--white:#FFFFFF;--gray:#B3B3B3;--pink:#F037A5;--blue:#509BF5}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'Figtree','DM Sans','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:fixed;left:50%;top:50%;width:1080px;height:1920px;transform-origin:50% 50%;overflow:hidden;background:#000}
#world{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 44%;overflow:hidden;background:#000;transform-origin:50% 50%}
#cam{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d}
.L-bg{transform:translateZ(-450px) scale(1.25)}
.L-mid{transform:translateZ(-170px) scale(1.09)}
.L-hero{transform:translateZ(0px)}
.L-glass{transform:translateZ(170px) scale(.91)}
.L-dust{transform:translateZ(340px) scale(.83)}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:translateZ(-90px);pointer-events:none}
.bgfill{position:absolute;left:-12%;top:-12%;width:124%;height:124%;transform-origin:50% 50%;background:#000}
#dustc{position:absolute;left:0;top:0;width:1080px;height:1920px}
#safezone{position:absolute;left:72px;top:250px;width:936px;height:1310px;border:1px dashed rgba(255,255,255,.35);pointer-events:none;display:none;z-index:99}
#debug{position:fixed;left:14px;bottom:14px;z-index:120;display:none;font:600 13px/1.5 ui-monospace,monospace;color:#fff;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);padding:9px 12px;border-radius:10px;white-space:pre;pointer-events:none}
#debug b{color:var(--green)}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 0 14px;transition:opacity .35s}
#bar{width:min(70vw,520px);height:4px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;cursor:pointer}
#barfill{height:100%;width:0;background:var(--green);border-radius:99px}
#btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;opacity:.9}
#btns button{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(20,20,20,.72);color:#fff;font:700 12px/1 'Figtree',sans-serif;padding:9px 11px;border-radius:9px;cursor:pointer}
#btns button:hover{background:rgba(40,40,40,.9)}
#btns button.on{background:var(--green);color:#000;border-color:var(--green)}
#btns button.dl{background:var(--black);border:1px solid var(--green);color:#fff}
#btns button.dl:hover{background:var(--green);color:#000}
#tap{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;background:radial-gradient(120% 90% at 50% 38%,#1ED760 0%,#0e7a3c 34%,#0a0a0a 76%);transition:opacity .5s}
#tap.hide{opacity:0;pointer-events:none}
#tap .lgo{width:96px;height:96px;border-radius:50%;background:var(--green);display:grid;place-items:center;animation:rip 2s infinite}
@keyframes rip{0%{box-shadow:0 0 0 0 rgba(30,215,96,.6)}70%{box-shadow:0 0 0 26px rgba(30,215,96,0)}100%{box-shadow:0 0 0 0 rgba(30,215,96,0)}}
#tap h1{color:#fff;font-weight:900;font-size:44px;letter-spacing:-.03em}
#tap p{color:rgba(255,255,255,.86);font-weight:700;font-size:17px;letter-spacing:-.01em}
#tap small{color:rgba(255,255,255,.5);font-weight:600;font-size:12px;margin-top:8px}
#tap .play{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-top:10px}
#boot{position:fixed;inset:0;background:#000;z-index:210;display:grid;place-items:center;color:#777;font:700 14px 'Figtree',sans-serif;letter-spacing:.02em}
</style>
</head>
<div id="stage"><div id="world"><div id="cam">
  <div class="layer L-bg"><div class="bgfill" id="bgfill"></div></div>

</div></div><div id="safezone"></div></div>

  <div class="lgo"><svg width="52" height="52" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1ED760"/><path d="M6.4 9.3c3.9-1.1 8-.7 11.3 1.1" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M6.9 12.5c3.2-.9 6.6-.5 9.4 1" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M7.4 15.6c2.5-.7 5.2-.4 7.4.8" stroke="#000" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></div>
  <h1>Spotify</h1><p>Music for Everyone</p>

  <small>Tap to play with sound &middot; 35s &middot; seamless loop</small>
</div>
<div id="boot">loading&hellip;</div>
<script>
'use strict';
/* SPOTIFY: MUSIC FOR EVERYONE - 1080x1920 @ 110BPM, 64 beats */
const W=1080,H=1920,BPM=110,BEAT=60/BPM,BEATS=64,DUR=BEATS*BEAT;
const B=n=>n*BEAT;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.prototype.slice.call(r.querySelectorAll(s));
const tl=gsap.timeline({paused:true});
const scenes={};
const qs=new URLSearchParams(location.search);
let LOWQ=qs.get('low')==='1';
const LOOP=qs.get('loop')!=='0';
const LAY={bg:$('.L-bg'),mid:$('.L-mid'),hero:$('.L-hero'),glass:$('.L-glass'),dust:$('.L-dust')};
const bgel=$('#bgfill'), midel=$('#midfill');
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||document.body).appendChild(e);return e;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rng(seed){return mulberry32(seed>>0);}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function pose(n,x,y){n.style.position='absolute';n.style.left=x+'px';n.style.top=y+'px';return n;}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
function setText(n,txt){n.textContent=txt;}
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;}

/* ---------- ASSET LOADER ---------- */
const ASSETS={logo:'spotify-logo.png',appstore:'appstore.png',gplay:'googleplay.png'};
const AIMG={logo:null,appstore:null,gplay:null};
function preload(src,ms){return new Promise(function(res){const im=new Image();let done=false;const fin=function(ok){if(done)return;done=true;res(ok?im:null);};im.onload=function(){fin(true);};im.onerror=function(){fin(false);};im.src=src;setTimeout(function(){fin(false);},ms||1500);});}
function bootAssets(){
  return Promise.all([
    preload(ASSETS.logo,1500),preload(ASSETS.appstore,1500),preload(ASSETS.gplay,1500),
    document.fonts?document.fonts.ready:Promise.resolve()
  ]).then(function(r){AIMG.logo=r[0];AIMG.appstore=r[1];AIMG.gplay=r[2];});
}

/* ---------- AUDIO ENGINE (synthesized only) ---------- */
const ROOTS=[55,43.65,65.41,49];
const CHORDS=[[110,130.81,164.81],[87.31,110,130.81],[130.81,164.81,196],[98,123.47,146.83]];
const LEADNOTES=[220,261.63,329.63,392,329.63,261.63,392,329.63];
const AE={
  ctx:null,master:null,comp:null,muted:false,nodes:[],noise:null,ev:null,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    this.ctx=new AC();
    this.comp=this.ctx.createDynamicsCompressor();
    this.comp.threshold.value=-12;this.comp.ratio.value=6;this.comp.attack.value=.004;this.comp.release.value=.25;
    this.master=this.ctx.createGain();this.master.gain.value=.8;
    this.master.connect(this.comp);this.comp.connect(this.ctx.destination);
    const sr=this.ctx.sampleRate,len=Math.floor(sr*2);
    this.noise=this.ctx.createBuffer(1,len,sr);
    const d=this.noise.getChannelData(0),r=mulberry32(7);
    for(let i=0;i<len;i++)d[i]=r()*2-1;
    this.ev=this.build();
  },
  t(beat){return this.ctx.currentTime+Math.max(0,B(beat)-tl.time());},
  reg(src,end){this.nodes.push({n:src,e:end});},
  noiseSrc(){const s=this.ctx.createBufferSource();s.buffer=this.noise;s.loop=true;return s;},
  kick(beat,vol){
    if(!this.ctx)return;const t=this.t(beat),v=vol==null?1:vol;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.35);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.95*v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.38);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.4);this.reg(o,t+.4);
  },
  clap(beat,vol){
    if(!this.ctx)return;const t=this.t(beat),v=vol==null?1:vol;
    const s=this.noiseSrc(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    f.type='bandpass';f.frequency.value=1800;f.Q.value=.8;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5*v,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+.2);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+.22);this.reg(s,t+.22);
  },
  hat(beat,vol){
    if(!this.ctx)return;const t=this.t(beat),v=vol==null?1:vol;
    const s=this.noiseSrc(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    f.type='highpass';f.frequency.value=7200;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16*v,t+.003);g.gain.exponentialRampToValueAtTime(.001,t+.05);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+.06);this.reg(s,t+.06);
  },
  bass(beat,freq,vol){
    if(!this.ctx)return;const t=this.t(beat),v=vol==null?1:vol;
    const o=this.ctx.createOscillator(),lp=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    o.type='sawtooth';o.frequency.value=freq;
    lp.type='lowpass';lp.frequency.value=400;lp.Q.value=6;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.32*v,t+.02);g.gain.setValueAtTime(.32*v,t+.24);g.gain.exponentialRampToValueAtTime(.001,t+.42);
    o.connect(lp);lp.connect(g);g.connect(this.master);o.start(t);o.stop(t+.45);this.reg(o,t+.45);
  },
  pad(beat,freqs,durBeats,vol){
    if(!this.ctx)return;const t=this.t(beat),v=vol==null?1:vol,dur=B(durBeats);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16*v,t+.35);
    for(let i=0;i<3;i++){const f=freqs[(i+1)%freqs.length]*2;const o=this.ctx.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=(i-1)*7;o.connect(g);o.start(t);o.stop(t+dur);this.reg(o,t+dur);}
    for(let k=1;k<durBeats;k++){const bt=t+B(k);g.gain.setValueAtTime(.16*v,bt-.01);g.gain.linearRampToValueAtTime(.064*v,bt+.02);g.gain.linearRampToValueAtTime(.16*v,bt+.15);}
    g.gain.setValueAtTime(.16*v,t+dur-.3);g.gain.linearRampToValueAtTime(.0001,t+dur);
    g.connect(this.master);
  },
  lead(beat,freq,vol){
    if(!this.ctx)return;const t=this.t(beat),v=vol==null?1:vol;
    const tri=this.ctx.createOscillator(),sq=this.ctx.createOscillator(),g=this.ctx.createGain(),g2=this.ctx.createGain(),lp=this.ctx.createBiquadFilter();
    tri.type='triangle';tri.frequency.value=freq;
    sq.type='square';sq.frequency.value=freq*2;
    lp.type='lowpass';lp.frequency.value=2600;
    g2.gain.value=.12;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15*v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.16);
    tri.connect(lp);sq.connect(g2);g2.connect(lp);lp.connect(g);g.connect(this.master);
    tri.start(t);sq.start(t);tri.stop(t+.18);sq.stop(t+.18);this.reg(tri,t+.18);
  },
  riser(beat,len){
    if(!this.ctx)return;const t=this.t(beat),d=len||1.2;
    const s=this.noiseSrc(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    f.type='lowpass';f.frequency.setValueAtTime(200,t);f.frequency.exponentialRampToValueAtTime(8000,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.22,t+d*.7);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+d);this.reg(s,t+d);
  },
  crash(beat,vol){
    if(!this.ctx)return;const t=this.t(beat),v=vol==null?1:vol;
    const s=this.noiseSrc(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    f.type='highpass';f.frequency.value=2600;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4*v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.5);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+1.5);this.reg(s,t+1.5);
  },
  whoosh(beat){
    if(!this.ctx)return;const t=this.t(beat);
    const s=this.noiseSrc(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    f.type='bandpass';f.Q.value=.7;f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(6000,t+.4);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.2,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.4);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+.42);this.reg(s,t+.42);
  },
  tick(beat,vol){
    if(!this.ctx)return;const t=this.t(beat),v=vol==null?1:vol;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.value=1200;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22*v,t+.003);g.gain.exponentialRampToValueAtTime(.001,t+.03);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.035);this.reg(o,t+.035);
  },
  build(){
    const ev=[];
    for(let b=0;b<64;b++){if(!(b>=54.5&&b<55))ev.push({b:b,f:'kick'});}
    for(let bar=2;bar<16;bar++){ev.push({b:bar*4+1,f:'clap'});ev.push({b:bar*4+3,f:'clap'});}
    for(let b=8;b<64;b+=.5){if(!(b>=54.5&&b<55))ev.push({b:b,f:'hat',v:.7});}
    for(let b=0;b<64;b++){
      if(b<8){if(b%2===0)ev.push({b:b,f:'bass',r:ROOTS[0]});}
      else if(b<54||b>=58){ev.push({b:b,f:'bass',r:ROOTS[Math.floor(b/4)%4]});}
    }
    for(let bar=2;bar<16;bar++){
      ev.push({b:bar*4,f:'pad',ch:CHORDS[bar%4]});
      ev.push({b:bar*4,f:'pad',ch:CHORDS[(bar+1)%4]});
    }
    for(let b=24;b<46;b+=.25){ev.push({b:b,f:'lead',n:LEADNOTES[Math.round(b*4)%LEADNOTES.length],v:.5});}
    for(let b=58;b<64;b+=.5){ev.push({b:b,f:'lead',n:LEADNOTES[Math.round(b*2)%LEADNOTES.length],v:.7});}
    ev.push({b:52,f:'riser',d:.9});
    ev.push({b:53.5,f:'riser',d:1.4});
    for(let b=53.5;b<54.5;b+=.25){ev.push({b:b,f:'clap',v:.5});}
    ev.push({b:55,f:'crash'});
    ev.push({b:63,f:'crash',v:.5});
    ev.push({b:63,f:'tick'});
    ev.sort(function(a,b){return a.b-b.b;});
    return ev;
  },
  startFrom(){
    if(!this.ctx)return;
    this.stopAll();
    if(!this.ev)this.ev=this.build();
    const now=tl.time();
    for(let i=0;i<this.ev.length;i++){
      const e=this.ev[i];
      if(B(e.b)<now-.06)continue;
      if(B(e.b)>now+36)break;
      if(e.f==='kick')this.kick(e.b);
      else if(e.f==='clap')this.clap(e.b,e.v);
      else if(e.f==='hat')this.hat(e.b,e.v);
      else if(e.f==='bass')this.bass(e.b,e.r,e.v);
      else if(e.f==='pad')this.pad(e.b,e.ch,4,.9);
      else if(e.f==='lead')this.lead(e.b,e.n,e.v);
      else if(e.f==='riser')this.riser(e.b,e.d);
      else if(e.f==='crash')this.crash(e.b,e.v);
      else if(e.f==='tick')this.tick(e.b);
    }
  },
  stopAll(){
    for(let i=0;i<this.nodes.length;i++){const r=this.nodes[i];try{r.n.stop(0);}catch(err){}try{r.n.disconnect();}catch(err){}}
    this.nodes=[];
  },
  mute(m){this.muted=m;if(this.master){this.master.gain.setTargetAtTime(m?0:.8,this.ctx.currentTime,.02);}$('#bMute').classList.toggle('on',m);},
  suspend(){if(this.ctx&&this.ctx.state==='running')this.ctx.suspend();},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}
};

/* ---------- ENGINE: CAMERA + LAYERS ---------- */
const worldEl=$('#world'), camEl=$('#cam');
const CAM={scale:1,punch:1,sx:0,sy:0,cx:0,cy:0,rotX:0,rotY:0,rotZ:0,blur:0,lb:0,lm:0,lh:0,lg:0,ld:0};
const UPDATERS=[];
function onTick(fn){UPDATERS.push(fn);}
function applyCam(){
  worldEl.style.transform='translate3d('+CAM.sx.toFixed(2)+'px,'+CAM.sy.toFixed(2)+'px,0) scale('+(CAM.scale*CAM.punch).toFixed(4)+') rotate('+CAM.rotZ.toFixed(2)+'deg)';
  camEl.style.transform='translate3d('+CAM.cx.toFixed(2)+'px,'+CAM.cy.toFixed(2)+'px,0) rotateX('+CAM.rotX.toFixed(2)+'deg) rotateY('+CAM.rotY.toFixed(2)+'deg)';
  worldEl.style.filter=CAM.blur>0.15?'blur('+CAM.blur.toFixed(1)+'px)':'';
  LAY.bg.style.transform='translateZ(-450px) translateX('+CAM.lb.toFixed(2)+'px) scale(1.25)';
  LAY.mid.style.transform='translateZ(-170px) translateX('+CAM.lm.toFixed(2)+'px) scale(1.09)';
  LAY.hero.style.transform='translateZ(0px) translateX('+CAM.lh.toFixed(2)+'px)';
  LAY.glass.style.transform='translateZ(170px) translateX('+CAM.lg.toFixed(2)+'px) scale(.91)';
  LAY.dust.style.transform='translateZ(340px) translateX('+CAM.ld.toFixed(2)+'px) scale(.83)';
}
function push(t,dur,pct){tl.to(CAM,{scale:1+pct/100,duration:dur,ease:'power2.inOut'},t);}
function orbit(t,dur,deg){tl.to(CAM,{rotY:deg,duration:dur,ease:'sine.inOut'},t);}
function crane(t,dur,px){tl.to(CAM,{lb:px*.42,lm:px*.62,ld:px*.82,duration:dur,ease:'power2.inOut'},t);}
function tilt(t,dur,deg){tl.to(CAM,{rotX:deg,duration:dur,ease:'sine.inOut'},t);}

function dutch(t,deg){tl.to(CAM,{rotZ:deg,duration:.15,ease:'power3.out'},t).to(CAM,{rotZ:0,duration:.40,ease:'power2.inOut'},t+.55);}
function shake(t,px){const r=rng(Math.round(t*1000)+3);for(let i=0;i<6;i++){tl.to(CAM,{sx:(r()-.5)*px*2,sy:(r()-.5)*px*2,duration:.045,ease:'none'},t+i*.045);}tl.to(CAM,{sx:0,sy:0,duration:.12,ease:'power2.out'},t+.28);}

function track(t,dur,o){o=o||{};const m=26;tl.to(CAM,{lb:(o.bg||0)*m,lm:(o.mid||0)*m,lh:(o.hero||0)*m,lg:(o.glass||0)*m,ld:(o.dust||0)*m,duration:dur,ease:'power2.inOut'},t);}

function slowmo(t,dur){tl.to(CAM,{blur:1.6,duration:.35,ease:'power2.out'},t).to(CAM,{blur:0,duration:Math.max(.4,dur-.35),ease:'power1.inOut'},t+.35);}

/* ---------- TEXT ENGINE ---------- */
const T={};
T.make=function(parent,html,o){
  o=o||{};
  const root=el('div','tblock',parent||LAY.hero);
  const width=o.width||936;
  const top=(o.top!=null?o.top:(o.anchor==='TEXT_MID'?700:(o.anchor==='TEXT_LOW'?1060:280)));
  root.style.cssText='position:absolute;left:'+(o.x!=null?o.x:540)+'px;margin-left:'+(-width/2)+'px;width:'+width+'px;top:'+top+'px;font-size:'+(o.size||92)+'px;line-height:'+(o.lh||1.04)+';font-weight:'+(o.weight||800)+';letter-spacing:-0.03em;color:'+(o.color||'#000')+';text-align:center;opacity:0;will-change:transform,filter;';
  const words=[],chars=[],ems=[];
  const segs=[];const re=/<em>([\s\S]*?)<\/em>/g;let last=0,m;
  while((m=re.exec(html))){if(m.index>last)segs.push({t:html.slice(last,m.index),em:false});segs.push({t:m[1],em:true});last=m.index+m[0].length;}
  if(last<html.length)segs.push({t:html.slice(last),em:false});
  segs.forEach(function(seg){
    const parts=seg.t.split(/(\s+)/);
    parts.forEach(function(part){
      if(!part)return;
      if(/^\s+$/.test(part)){root.appendChild(document.createTextNode(' '));return;}
      const w=el('span','w',root,'');
      w.style.cssText='display:inline-block;position:relative;white-space:pre;';
      const wc=[];
      for(let i=0;i<part.length;i++){
        const c=el('span','c',w,part[i]);
        c.style.cssText='display:inline-block;will-change:transform;';
        if(seg.em)c.style.color=o.emColor||'var(--green)';
        wc.push(c);
      }
      words.push({el:w,text:part,em:seg.em,chars:wc});
      wc.forEach(function(c){chars.push(c);});
      if(seg.em)ems.push(w);
    });
  });
  const api={root:root,words:words,chars:chars,ems:ems,size:(o.size||92),color:(o.color||'#000'),top:top};
  root.__t=api;
  return api;
};

/* ---------- TEXT RECIPES ---------- */
function wels(n){return n&&n.words?n.words.map(function(w){return w.el;}):[n];}
function cels(n){return n&&n.chars?n.chars:[n];}
const R={};
function reveal(n,t){const r=n&&n.root?n.root:n;tl.set(r,{opacity:1},t-.001);}
R.slam=function(n,t,o){
  o=o||{};reveal(n,t);
  const els=wels(n),st=o.stagger==null?.03:o.stagger;
  els.forEach(function(e,i){
    tl.fromTo(e,{scale:o.from||1.6,filter:'blur(16px)',opacity:0},{scale:1.02,filter:'blur(0px)',opacity:1,duration:.1,ease:'power4.out',immediateRender:false},t+i*st)
      .to(e,{scale:1,duration:.066,ease:'power2.out'},t+i*st+.1);
  });
  shake(t,o.shake==null?3:o.shake);
};
R.ribbon=function(n,t,o){
  o=o||{};reveal(n,t);
  const cs=cels(n),st=o.stagger==null?.02:o.stagger;
  cs.forEach(function(c,i){
    tl.fromTo(c,{y:60,rotation:6,filter:'blur(24px)',opacity:0},{y:0,rotation:0,filter:'blur(0px)',opacity:1,duration:.5,ease:'power3.out',immediateRender:false},t+i*st);
  });
};
R.stack=function(list,t,step){
  step=step==null?1:step;
  list.forEach(function(n,i){
    const tt=t+B(i*step);reveal(n,tt);
    wels(n).forEach(function(w,j){
      tl.fromTo(w,{y:44,opacity:0},{y:0,opacity:1,duration:.38,ease:'power3.out',immediateRender:false},tt+j*.05);
    });
    if(i>0){tl.to(wels(list[i-1]),{y:'-=20',rotation:-1,duration:.22,ease:'power2.out'},tt).to(wels(list[i-1]),{rotation:0,duration:.4,ease:'elastic.out(1,.5)'},tt+.22);}
  });
};
R.wave=function(n,t,o){
  o=o||{};reveal(n,t);
  cels(n).forEach(function(c,i){
    tl.fromTo(c,{y:70,opacity:0,filter:'blur(8px)'},{y:0,opacity:1,filter:'blur(0px)',duration:.9,ease:'elastic.out(1,.45)',immediateRender:false},t+i*.025);
  });
};
R.dropBounce=function(n,t,o){
  o=o||{};reveal(n,t);
  wels(n).forEach(function(w,i){
    const tt=t+i*.04;
    tl.fromTo(w,{y:-80,opacity:0,scaleY:1,scaleX:1},{y:0,opacity:1,duration:.26,ease:'power3.in',immediateRender:false},tt)
      .to(w,{scaleY:.9,scaleX:1.1,duration:.06,ease:'power1.out'},tt+.26)
      .to(w,{scaleY:1,scaleX:1,duration:.6,ease:'elastic.out(1,.45)'},tt+.32);
  });
  shake(t,4);
};
R.scaleJump=function(n,t,o){
  o=o||{};reveal(n,t);
  const r=n.root||n;
  const cs=cels(n);
  cs.forEach(function(c,i){
    tl.fromTo(c,{scale:1,filter:'blur(0px)'},{scale:2.1,filter:'blur(20px)',duration:.28,ease:'power2.out',immediateRender:false},t+i*.012)
      .to(c,{scale:1,filter:'blur(0px)',duration:.32,ease:'power3.inOut'},t+.28+i*.012);
  });
  if(o.ghost){
    const g=el('div','ghostword',n.root.parentNode,o.ghost);
    g.style.cssText='position:absolute;left:'+(n.root.style.left||'540px')+';top:'+(parseInt(n.root.style.top||'280')+60)+'px;transform:translateX(-50%) scale(1);font-size:420px;font-weight:900;letter-spacing:-0.05em;color:'+(o.ghostColor||'#000')+';opacity:0;white-space:nowrap;pointer-events:none;';
    tl.fromTo(g,{opacity:0,scale:.8},{opacity:.06,scale:1,duration:.5,ease:'power2.out',immediateRender:false},t).to(g,{opacity:0,duration:.5},t+B(2));
  }
};
R.bar=function(n,t,o){
  o=o||{};reveal(n,t);
  const words=(n&&n.words?n.words:[]).filter(function(w){return w.em;});
  const targets=words.length?words:[{el:(n.root||n)}];
  targets.forEach(function(w,i){
    const barEl=el('div','hl',w.el.parentNode,'');
    const wd=w.el.offsetWidth||300,ht=(w.el.offsetHeight||90);
    barEl.style.cssText='position:absolute;left:-14px;right:-14px;top:'+(ht*.1)+'px;height:'+(ht*.8)+'px;border-radius:14px;background:'+(o.color||'rgba(30,215,96,.9)')+';z-index:0;transform-origin:0% 50%;';
    w.el.querySelectorAll('.c').forEach(function(c){c.style.position='relative';c.style.zIndex='1';});
    tl.fromTo(barEl,{scaleX:0,opacity:0},{scaleX:1,opacity:.9,duration:.3,ease:'power3.out',immediateRender:false},t+i*.05);
  });
};
R.type=function(n,t,o){
  o=o||{};reveal(n,t);
  const cs=cels(n);
  cs.forEach(function(c,i){tl.fromTo(c,{opacity:0},{opacity:1,duration:.02,ease:'none',immediateRender:false},t+i*.0625);});
};
R.sweep=function(n,t,o){
  o=o||{};reveal(n,t);
  const r=n.root||n;
  const cs=cels(n);
  cs.forEach(function(c,i){tl.fromTo(c,{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0px)',duration:.16,ease:'power2.out',immediateRender:false},t+i*.006);});

  tl.fromTo(beam,{x:-200,opacity:0},{x:r.offsetWidth+240,opacity:.9,duration:.6,ease:'power2.inOut',immediateRender:false},t).to(beam,{opacity:0,duration:.15},t+.6);
};
R.focus=function(n,t,o){
  o=o||{};reveal(n,t);
  const r=n.root||n;
  tl.fromTo(r,{filter:'blur(28px)',letterSpacing:'0.08em',opacity:0},{filter:'blur(0px)',letterSpacing:'-0.03em',opacity:1,duration:.7,ease:'power2.out',immediateRender:false},t);

R.stretch=function(n,t,o){
  o=o||{};reveal(n,t);
  const r=n.root||n;
  tl.fromTo(r,{scale:1,opacity:0},{scale:1.08,opacity:1,duration:.18,ease:'power3.out',immediateRender:false},t)
    .to(r,{scale:1,duration:.42,ease:'elastic.out(1,.4)'},t+.18);

R.counter=function(node,t,from,to,dur,fmtFn){
  const o={v:from};
  tl.fromTo(o,{v:from},{v:to,duration:dur,ease:'power2.inOut',immediateRender:false,onUpdate:function(){
    setText(node,fmtFn?fmtFn(o.v):Math.round(o.v)+'%');

R.exit=function(n,t,o){
  o=o||{};
  const r=n&&n.root?n.root:n;
  tl.to(r,{scale:.97,duration:.06,ease:'power2.in'},t).to(r,{y:(o.y==null?-70:o.y),filter:'blur(14px)',opacity:0,duration:.25,ease:'power2.in'},t+.06);
};
R.hide=function(n,t){const r=n&&n.root?n.root:n;tl.set(r,{opacity:0},t);};
R.morph=function(n,t,o){
  o=o||{};reveal(n,t);
  const cs=cels(n);
  cs.forEach(function(c,i){tl.to(c,{y:i%2?18:-18,opacity:0,duration:.12,ease:'power2.in'},t+i*.008).to(c,{y:0,opacity:1,duration:.3,ease:'power2.out'},t+.14+i*.008);});

const DOTS=[];
function makeDot(layer,x,y,size,headphones){

      '<rect x="13.5" y="56" width="11" height="19" rx="5.5" fill="#2E2E2E"/><rect x="75.5" y="56" width="11" height="19" rx="5.5" fill="#2E2E2E"/>'+

  const cfg={b0:-1,b1:-1,amp:0};

  api.roll=function(t,x0,x1,dur){tl.fromTo(api.root,{x:x0},{x:x1,duration:dur,ease:'none',immediateRender:false},t);};
  api.setPos=function(t,nx,ny){tl.set(api.root,{left:nx,top:ny},t);};
  DOTS.push(api);
  return api;
}
onTick(function(t){
  const beat=t/BEAT,frac=beat-Math.floor(beat),env=Math.pow(1-frac,2.4);
  for(let i=0;i<DOTS.length;i++){
    const d=DOTS[i],cfg=d.cfg;
    const on=(cfg.b0>=0&&beat>=cfg.b0-.02&&beat<=cfg.b1);
    const e=on?env:0;
    d.inner.style.transform='translateY('+(-(cfg.amp||0)*e).toFixed(2)+'px) scale('+(1+.045*e).toFixed(4)+')';
    if(d.cups.length){
      const cy=(1.6*e).toFixed(2);
      d.cups[0].setAttribute('transform','translate(0 '+cy+')');
      if(d.cups[1])d.cups[1].setAttribute('transform','translate(0 '+cy+')');
    }
  }
});

const EQS=[];
function makeEQ(layer,x,y,n,w,h,color){
  const root=el('div','eq',layer,'');
  root.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:'+(n*w+(n-1)*8)+'px;height:'+h+'px;margin-left:'+(-(n*w+(n-1)*8)/2)+'px;display:flex;align-items:flex-end;gap:8px;';
  const bars=[];
  for(let i=0;i<n;i++){
    const b=el('div','bar',root,'');
    b.style.cssText='width:'+w+'px;height:'+h+'px;border-radius:'+(w/2)+'px;background:'+color+';transform-origin:50% 100%;transform:scaleY(.12);';
    bars.push(b);
  }
  const r=rng(Math.round(x+y+n));
  const seeds=[];for(let i=0;i<n;i++)seeds.push(r());
  const api={root:root,bars:bars,seeds:seeds,h:h,color:color};
  onTick(function(t){
    const beat=t/BEAT,frac=beat-Math.floor(beat),env=Math.pow(1-frac,3);
    for(let i=0;i<bars.length;i++){
      const s=seeds[i];
      const base=.16+.5*Math.abs(Math.sin(t*2.1+s*9.3));
      const v=clamp(base*(1-.3*env)+env*(.55+.45*s),.06,1);
      bars[i].style.transform='scaleY('+v.toFixed(3)+')';
    }
  });
  return api;
}

function drawDust(t){
  dustX.clearRect(0,0,1080,1920);
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;
    if(p.y<-20)p.y=1940;
    if(p.x<-20)p.x=1100;
    if(p.x>1100)p.x=-20;
    const a=(.10+p.z*.38)*(.6+.4*Math.sin(t*.9+i));

    dustX.beginPath();dustX.arc(p.x,p.y,p.r*(.5+p.z),0,6.283);dustX.fill();
  }
}

function ticker(){

  applyCam();
  renderGL(t);
  if(!LOWQ)drawDust(t);
  const beat=t/BEAT,frac=beat-Math.floor(beat),env=Math.pow(1-frac,3);
  bgel.style.transform='scale('+(1+.02*env).toFixed(4)+')';
  barfill.style.width=(clamp(t/DUR,0,1)*100).toFixed(2)+'%';

    fps=Math.round(frames*1000/fpsAcc);frames=0;fpsAcc=0;

}

function coverTexture(seed){
  const c=document.createElement('canvas');c.width=256;c.height=256;
  const x=c.getContext('2d');
  const pal=COVERPALS[Math.abs(seed)%COVERPALS.length];
  const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);
  x.fillStyle=g;x.fillRect(0,0,256,256);
  x.fillStyle=pal[2];
  if(seed%3===0){x.beginPath();x.arc(128,128,66,0,6.283);x.fill();}
  else if(seed%3===1){for(let i=0;i<4;i++){x.fillRect(36+i*50,44,22,170);}}
  else{for(let i=0;i<5;i++){x.globalAlpha=.5;x.beginPath();x.arc(128,128,30+i*24,0,6.283);x.fill();}x.globalAlpha=1;}
  const t=new THREE.CanvasTexture(c);
  return t;
}

    const mat=new THREE.MeshStandardMaterial({color:0x11A34A,emissive:0x1ED760,emissiveIntensity:.75,roughness:.45,metalness:.25});
    cityMesh=new THREE.InstancedMesh(box,mat,441);
    const dummy=new THREE.Object3D();
    const cr=rng(321);
    for(let j=0;j<21;j++){
      for(let i=0;i<21;i++){
        dummy.position.set((i-10)*21,0,(j-10)*21);
        dummy.scale.set(1,.2,1);
        dummy.updateMatrix();
        cityMesh.setMatrixAt(j*21+i,dummy.matrix);
        citySeed.push({i:i,j:j,ph:cr()*6.28,base:40+cr()*90});
      }
    }
    cityMesh.visible=false;
    cityMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    glScene.add(cityMesh);
    GLok=true;
  }catch(e){GLok=false;console.warn('GL fallback',e);}
}
initGL();
function renderGL(t){
  if(!renderer)return;
  if(GLX.mode==='off'){renderer.clear();return;}
  const fov=GLX.fov;
  glCam.fov=fov;glCam.updateProjectionMatrix();
  if(GLX.mode==='tunnel'){
    tunnelGroup.visible=true;cityMesh.visible=false;
    glCam.position.set(0,GLX.camY*6,300+GLX.camZ*88);
    glCam.rotation.set(0,0,GLX.rotZ*Math.PI/180);
    glCam.lookAt(0,0,GLX.camZ*88-1800);
  }else if(GLX.mode==='city'){
    tunnelGroup.visible=false;cityMesh.visible=true;
    const rx=GLX.rotX*Math.PI/180;
    const R=900;
    glCam.position.set(0,Math.sin(rx)*R,Math.cos(rx)*R);
    glCam.lookAt(0,0,0);
    const dummy=new THREE.Object3D();
    const beat=t/BEAT,frac=beat-Math.floor(beat),env=Math.pow(1-frac,4);
    for(let k=0;k<441;k++){
      const s=citySeed[k];
      const wave=.5+.5*Math.sin(beat*.9-s.i*.35+s.j*.28+s.ph);
      const h=s.base*(.25+.9*wave)+env*260*(.4+.6*Math.abs(Math.sin(s.ph+beat)));
      dummy.position.set((s.i-10)*21,h/2-90,(s.j-10)*21);
      dummy.scale.set(1,Math.max(2,h),1);
      dummy.updateMatrix();
      cityMesh.setMatrixAt(k,dummy.matrix);
    }
    cityMesh.instanceMatrix.needsUpdate=true;
  }
  renderer.render(glScene,glCam);
}
</script>
