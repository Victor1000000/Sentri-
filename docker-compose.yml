# Local development services: PostGIS + Redis. Not for production (no TLS, default passwords).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sentri
      POSTGRES_PASSWORD: sentri
      POSTGRES_DB: sentri
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persistence so queued alerts survive a restart
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
volumes:
  dbdata:
  redisdata:
