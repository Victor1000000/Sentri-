name: sentri
description: Sentri - one hidden action sends your live location to people you trust.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  battery_plus: ^6.0.3
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  permission_handler: ^11.3.1
  sensors_plus: ^6.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  share_plus: ^10.0.2
  connectivity_plus: ^6.0.5
  health: 13.3.1
  url_launcher: ^6.3.0
  flutter_tts: ^4.1.0
  camera: 0.11.4
  pedometer: ^4.1.1
  image_picker: ^1.1.2
  # v42: Add contact picks numbers from the phone's own saved contacts
  # (READ_CONTACTS asked in the sheet, one tap fills the phone field).
  # v42: 1.1.9 (exact) ships with a broken android namespace
  # (dev.fluttercommunity.plus.sensors - collides with sensors_plus, manifest
  # merge fails). 1.1.9+2 is the same code with namespace co.quis.flutter_contacts.
  flutter_contacts: 1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/directory/
