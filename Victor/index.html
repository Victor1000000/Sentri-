<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Victor">
  <meta name="description" content="Victor — your all-in-one daily companion for screen time, workouts, Bible verses, schedule, water, sleep and heart health.">
  <link rel="manifest" href="manifest.json">

  <div id="app">

        <div class="alarm-actions">
          <button class="btn btn-outline" id="alarm-snooze">Remind again</button>
          <button class="btn" id="alarm-started">I've started</button>
        </div>
      </div>
    </div>

    <nav class="top-bar" id="top-bar">
      <button class="back-btn hidden" id="back-btn" aria-label="Back">‹</button>
      <h1 class="page-title" id="page-title">Victor</h1>
      <div class="top-right" id="top-right"></div>
    </nav>

    <main class="pages" id="pages"></main>

    <nav class="tab-bar" id="tab-bar"></nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/notifications.js"></script>
