name: Apply Telegram sign-up patch

# One-time helper. Needs sentri-telegram-signup.patch at the top of the repo.
# It now runs by itself when that patch is uploaded (or when this file is saved),
# and it can still be started by hand: Actions > Apply Telegram sign-up patch > Run workflow.
# It applies the patch, runs the backend checks, and only if they pass it pushes the result to main
# and starts the APK build.
on:
  push:
    branches: [main]
    paths:
      - sentri-telegram-signup.patch
      - .github/workflows/apply-patch.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Never let two applies run over each other.
concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    # The commit this workflow makes deletes the patch file, and deleting it counts as a change to
    # that path, so it would start this workflow again. Skip that run: only a real upload or a
    # manual run may apply a patch.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: |
          set -o pipefail
          test -f sentri-telegram-signup.patch || { echo "::error::sentri-telegram-signup.patch is not at the top of the repo"; exit 1; }
          git apply --check sentri-telegram-signup.patch 2>&1 | tee "$RUNNER_TEMP/apply.log" || { echo "::error::The patch does not fit the current code: $(head -c 600 "$RUNNER_TEMP/apply.log" | tr '\n' ' ')"; exit 1; }
          git apply sentri-telegram-signup.patch
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend install, type check and tests
        working-directory: backend
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund --no-package-lock \
            && npx tsc --noEmit \
            && npx vitest run --exclude test/pg.integration.test.ts; } 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Show the problem on the run page
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'check.log')
          t = open(p, errors='replace').read()[-3500:] if os.path.exists(p) else 'no log'
          print('::error title=backend check::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q sentri-telegram-signup.patch
          git add -A
          git commit -q -m "Sign-up codes through a Telegram bot; fix backend type errors"
          git push origin HEAD:main

      - name: Start the APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sentri-apk.yml --ref main
